<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="720" height="320" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#3451b2">霸天虎 RGB 灯原理：共阳接法，低电平点亮</text>
  <text x="24" y="50" font-size="12" fill="#666">3.3V → 共阳极 → LED → 限流电阻 → GPIO；引脚拉低才有电流，所以写 0 亮、写 1 灭</text>

  <!-- 3V3 电源轨 -->
  <line x1="80" y1="80" x2="660" y2="80" stroke="#d97706" stroke-width="3"/>
  <text x="80" y="70" font-size="13" font-weight="bold" fill="#d97706">3V3</text>

  <!-- 红灯支路 -->
  <!-- 共阳节点 -->
  <line x1="200" y1="80" x2="200" y2="100" stroke="#d97706" stroke-width="2"/>
  <!-- LED 符号：三角形 + 竖线（阴极） -->
  <polygon points="200,100 184,130 216,130" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="184" y1="130" x2="216" y2="130" stroke="#c0392b" stroke-width="2"/>
  <line x1="200" y1="100" x2="200" y2="130" stroke="#c0392b" stroke-width="2"/>
  <!-- 发光箭头 -->
  <line x1="210" y1="106" x2="224" y2="92" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="224,92 216,94 220,100" fill="#c0392b"/>
  <line x1="218" y1="114" x2="232" y2="100" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="232,100 224,102 228,108" fill="#c0392b"/>
  <text x="150" y="122" font-size="12" fill="#c0392b" text-anchor="end">LED_R</text>
  <!-- 阴极到电阻 -->
  <line x1="200" y1="130" x2="200" y2="170" stroke="#333" stroke-width="2"/>
  <!-- 限流电阻（矩形画法） -->
  <rect x="188" y="170" width="24" height="56" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="226" y="202" font-size="12" fill="#333">R 330Ω</text>
  <line x1="200" y1="226" x2="200" y2="250" stroke="#333" stroke-width="2"/>
  <!-- 到 MCU 引脚 -->
  <line x1="200" y1="250" x2="360" y2="250" stroke="#333" stroke-width="2"/>

  <!-- MCU 框 -->
  <rect x="360" y="200" width="220" height="100" fill="#fff" stroke="#3451b2" stroke-width="2" rx="8"/>
  <text x="470" y="222" font-size="13" fill="#3451b2" text-anchor="middle" font-weight="bold">STM32F407ZGT6</text>
  <circle cx="360" cy="250" r="4" fill="#3451b2"/>
  <text x="374" y="254" font-size="12" fill="#3451b2" font-family="Consolas,monospace">PF6（红）</text>
  <text x="374" y="278" font-size="11" fill="#888">输出低 → 灯亮；输出高 → 灯灭</text>

  <!-- 电流方向注解（引脚=0 时） -->
  <path d="M 240 110 L 240 240 L 350 250" fill="none" stroke="#3eaf7c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#3eaf7c"/>
    </marker>
  </defs>
  <text x="252" y="180" font-size="11" fill="#3eaf7c">PF6=0 时电流路径：3V3 → LED → R → 引脚灌入</text>

  <!-- 绿/蓝支路（虚线示意） -->
  <g opacity="0.55">
    <line x1="330" y1="80" x2="330" y2="100" stroke="#d97706" stroke-width="2"/>
    <polygon points="330,100 314,130 346,130" fill="none" stroke="#1a7f56" stroke-width="2"/>
    <line x1="314" y1="130" x2="346" y2="130" stroke="#1a7f56" stroke-width="2"/>
    <line x1="330" y1="100" x2="330" y2="130" stroke="#1a7f56" stroke-width="2"/>
    <rect x="318" y="170" width="24" height="56" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="330" y1="130" x2="330" y2="170" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="330" y1="226" x2="330" y2="250" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="280" y="122" font-size="11" fill="#1a7f56" text-anchor="end">LED_G → PF7</text>

    <line x1="440" y1="80" x2="440" y2="100" stroke="#d97706" stroke-width="2"/>
    <polygon points="440,100 424,130 456,130" fill="none" stroke="#3451b2" stroke-width="2"/>
    <line x1="424" y1="130" x2="456" y2="130" stroke="#3451b2" stroke-width="2"/>
    <line x1="440" y1="100" x2="440" y2="130" stroke="#3451b2" stroke-width="2"/>
    <text x="466" y="122" font-size="11" fill="#3451b2">LED_B → PF8</text>
  </g>

  <!-- 结论条 -->
  <rect x="80" y="278" width="560" height="30" fill="#fdf0d5" stroke="#d97706" rx="6"/>
  <text x="360" y="298" font-size="13" fill="#a16207" text-anchor="middle">口诀：共阳灯，反着点 —— BSRR 高 16 位写 1（拉低）= 亮，低 16 位写 1（拉高）= 灭</text>
</svg>
