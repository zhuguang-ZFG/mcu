<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="720" height="420" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">信号量 vs 互斥锁：计数牌与钥匙</text>
  <text x="24" y="50" font-size="12" fill="#666">计数信号量 = 停车场还剩几个位（谁都能进出）；互斥锁 = 厕所钥匙（有主，借的时候连优先级都临时借走）</text>

  <!-- ===== 左：计数信号量 ===== -->
  <rect x="36" y="70" width="316" height="240" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="52" y="94" font-size="13" font-weight="bold" fill="#3451b2">计数信号量 = 停车场</text>
  <!-- 计数牌 -->
  <rect x="52" y="106" width="120" height="56" fill="#dbe7ff" stroke="#3451b2" rx="6"/>
  <text x="112" y="128" font-size="11" fill="#3451b2" text-anchor="middle">剩余车位</text>
  <g font-size="20" font-weight="bold" fill="#3451b2" text-anchor="middle" font-family="Consolas,monospace">
    <text x="112" y="152" opacity="0">2<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="112" y="152" opacity="0">1<animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="112" y="152" opacity="0">0<animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;1;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="112" y="152" opacity="0">1<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;1;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="112" y="152" opacity="1">3<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0;1" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
  </g>

  <!-- 车位 ×3 -->
  <g stroke="#94a3b8" fill="#f8fafc">
    <rect x="196" y="106" width="64" height="36" rx="4"/><rect x="196" y="150" width="64" height="36" rx="4"/><rect x="196" y="194" width="64" height="36" rx="4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#3eaf7c" font-weight="bold">
    <text x="228" y="129" opacity="0">车A<animate attributeName="opacity" calcMode="discrete" values="0;1;1;1;1;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="228" y="173" opacity="0">车B<animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;1;1;1;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="228" y="217" opacity="0">车C<animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;1;1;1;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
  </g>
  <!-- 等待的车 -->
  <text x="300" y="270" font-size="11" fill="#d97706" text-anchor="middle" opacity="0">车D 排队等位…
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
  </text>
  <text x="300" y="270" font-size="11" fill="#3eaf7c" text-anchor="middle" opacity="0">车D 进场！
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
  </text>

  <!-- ===== 右：互斥锁 ===== -->
  <rect x="368" y="70" width="316" height="240" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="384" y="94" font-size="13" font-weight="bold" fill="#3451b2">互斥锁 = 厕所钥匙（有主）</text>

  <rect x="384" y="106" width="120" height="56" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="444" y="128" font-size="11" fill="#92400e" text-anchor="middle">钥匙在谁手</text>
  <g font-size="14" font-weight="bold" text-anchor="middle" font-family="Consolas,monospace">
    <text x="444" y="152" fill="#3eaf7c" opacity="1">空闲<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0;1" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="444" y="152" fill="#d97706" opacity="0">TaskL<animate attributeName="opacity" calcMode="discrete" values="0;1;1;1;1;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
  </g>

  <!-- 优先级继承小剧场 -->
  <g font-size="11">
    <text x="520" y="122" fill="#666">TaskL 持锁（优先级 1）</text>
    <text x="520" y="140" fill="#666" opacity="0">TaskH 来抢锁（优先级 3）…
      <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="520" y="140" fill="#d97706" font-weight="bold" opacity="0">继承！L 临时升 3，快进快出
      <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="520" y="140" fill="#3eaf7c" font-weight="bold" opacity="0">L 还锁 → H 立刻拿到
      <animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="520" y="164" fill="#888" opacity="0">优先级继承：防"中优先级任务插队卡死高优先级"
      <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 对比条 -->
  <rect x="36" y="322" width="648" height="40" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
  <text x="52" y="340" font-size="11" fill="#666">选型口诀：<tspan font-weight="bold" fill="#3451b2">保护资源用互斥锁（有主、带继承），发信号/数资源用信号量（无主、可计数）。</tspan>二值信号量 ≈ 简化版信号量，不防优先级翻转。</text>
  <text x="52" y="355" font-size="10" fill="#888">ISR 里只能给（Give）、不能拿（Take 会睡觉，ISR 不许睡）</text>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="396">① 开局：车位 3，钥匙挂墙——资源都在等任务</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="396">② 车A 进场（Take 成功，计数-1）；TaskL 拿到钥匙</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="396">③ 车B 再进（剩 1）；TaskH 来抢钥匙——被挡在门外</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="396">④ 车C 占满（剩 0，车D 排队）；L 临时升到优先级 3——继承！</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="396">⑤ 车A 离场（Give，剩 1，车D 进场）；L 还钥匙，H 秒接</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;1;1" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="396">⑥ 计数管"几个"，钥匙管"谁的"——下一章看翻转事故现场 →</text></g>
  </g>
</svg>
