<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>FreeRTOS GDB 调试实战：指认 TCB 与栈内容</title>
  <desc>四阶段动画：连接目标 → 查看当前任务 → 检查栈内容 → 设置断点，展示 FreeRTOS 调试的核心 GDB 命令与证据链</desc>
  
  <rect width="720" height="440" fill="#f6f8fa"/>
  
  <!-- Stage 1: Connect -->
  <g>
    <text x="20" y="25" font-size="14" font-weight="bold" fill="#3451b2">① 连接目标</text>
    
    <rect x="20" y="40" width="160" height="110" rx="4" fill="#ffffff" stroke="#3451b2" stroke-width="1.5"/>
    <text x="30" y="58" font-size="10" fill="#333" font-family="monospace">
      <tspan x="30" dy="0" fill="#666"># 启动 OpenOCD</tspan>
      <tspan x="30" dy="14">openocd -f interface/stlink.cfg</tspan>
      <tspan x="30" dy="14" fill="#666">      -f target/stm32f4x.cfg</tspan>
      <tspan x="30" dy="18" fill="#666"># 另开终端，连 GDB</tspan>
      <tspan x="30" dy="14">arm-none-eabi-gdb build.elf</tspan>
      <tspan x="30" dy="14">(gdb) target remote :3333</tspan>
    </text>
    
    <text x="30" y="140" font-size="9" fill="#3eaf7c" font-weight="bold">✓ 连接成功</text>
  </g>
  
  <!-- Stage 2: Inspect current task -->
  <g>
    <text x="200" y="25" font-size="14" font-weight="bold" fill="#3451b2">② 查看当前任务</text>
    
    <rect x="200" y="40" width="160" height="110" rx="4" fill="#ffffff" stroke="#3eaf7c" stroke-width="1.5"/>
    <text x="210" y="58" font-size="10" fill="#333" font-family="monospace">
      <tspan x="210" dy="0" fill="#666"># 当前任务 TCB 指针</tspan>
      <tspan x="210" dy="14">(gdb) p pxCurrentTCB</tspan>
      <tspan x="210" dy="14">$1 = (tskTCB*) 0x20001a80</tspan>
      <tspan x="210" dy="18" fill="#666"># 任务名</tspan>
      <tspan x="210" dy="14">(gdb) p pxCurrentTCB->pcTaskName</tspan>
      <tspan x="210" dy="14">$2 = "high\000\000..."</tspan>
    </text>
    
    <text x="210" y="140" font-size="9" fill="#d97706" font-weight="bold">⚠ 正在运行 high 任务</text>
  </g>
  
  <!-- Stage 3: Examine stack -->
  <g>
    <text x="380" y="25" font-size="14" font-weight="bold" fill="#3451b2">③ 检查栈内容</text>
    
    <rect x="380" y="40" width="160" height="110" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="390" y="58" font-size="10" fill="#333" font-family="monospace">
      <tspan x="390" dy="0" fill="#666"># 栈顶指针</tspan>
      <tspan x="390" dy="14">(gdb) p pxCurrentTCB->pxTopOfStack</tspan>
      <tspan x="390" dy="14">$3 = (StackType_t*) 0x20001b80</tspan>
      <tspan x="390" dy="18" fill="#666"># 看栈里 16 个字</tspan>
      <tspan x="390" dy="14">(gdb) x/16xw $3</tspan>
      <tspan x="390" dy="14" fill="#dc2626">0x01000000 ← xPSR</tspan>
    </text>
    
    <text x="390" y="140" font-size="9" fill="#dc2626" font-weight="bold">⚠ Thumb 位 = 1 ✓</text>
  </g>
  
  <!-- Stage 4: Set breakpoint -->
  <g>
    <text x="560" y="25" font-size="14" font-weight="bold" fill="#3451b2">④ 设置断点</text>
    
    <rect x="560" y="40" width="140" height="110" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="570" y="58" font-size="10" fill="#333" font-family="monospace">
      <tspan x="570" dy="0" fill="#666"># 在任务函数打断</tspan>
      <tspan x="570" dy="14">(gdb) break high_task</tspan>
      <tspan x="570" dy="14">Breakpoint 1 at 0x8000189</tspan>
      <tspan x="570" dy="18" fill="#666"># 继续跑</tspan>
      <tspan x="570" dy="14">(gdb) continue</tspan>
      <tspan x="570" dy="14" fill="#3eaf7c">→ 命中断点</tspan>
    </text>
    
    <text x="570" y="140" font-size="9" fill="#3eaf7c" font-weight="bold">✓ 断点命中</text>
  </g>
  
  <!-- Bottom: Common commands -->
  <rect x="20" y="170" width="680" height="100" rx="6" fill="#ffffff" stroke="#3451b2" stroke-width="2"/>
  <text x="30" y="190" font-size="13" font-weight="bold" fill="#3451b2">✓ FreeRTOS 调试常用命令</text>
  <text x="30" y="210" font-size="11" fill="#333" font-family="monospace">
    <tspan x="30" dy="0" fill="#3451b2">p pxCurrentTCB</tspan>
    <tspan fill="#666"> → 当前任务 TCB</tspan>
    <tspan x="30" dy="16" fill="#3451b2">p pxCurrentTCB->uxPriority</tspan>
    <tspan fill="#666"> → 当前优先级</tspan>
    <tspan x="30" dy="16" fill="#3451b2">info tasks</tspan>
    <tspan fill="#666"> → 所有任务状态（需 FreeRTOS-GDB 插件）</tspan>
    <tspan x="30" dy="16" fill="#3451b2">x/16xw pxCurrentTCB->pxTopOfStack</tspan>
    <tspan fill="#666"> → 栈内容（指认 xPSR/PC/LR）</tspan>
  </text>
  
  <!-- Bottom: Debugging tips -->
  <rect x="20" y="290" width="680" height="130" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="30" y="310" font-size="13" font-weight="bold" fill="#d97706">⚠ 调试纪律</text>
  <text x="30" y="330" font-size="11" fill="#333">
    <tspan x="30" dy="0">1. <tspan font-weight="bold" fill="#dc2626">断点会改变时序</tspan>：实时任务调试时，断点暂停会让其他任务"饿死"——观察到的行为可能失真</tspan>
    <tspan x="30" dy="18">2. <tspan font-weight="bold" fill="#dc2626">看门狗会咬人</tspan>：调试暂停时 TWDT 可能超时复位——调试前禁用看门狗或延长超时</tspan>
    <tspan x="30" dy="18">3. <tspan font-weight="bold" fill="#dc2626">栈内容会变</tspan>：每次暂停看到的栈顶不同——多抓几次，找规律</tspan>
    <tspan x="30" dy="18">4. <tspan font-weight="bold" fill="#3eaf7c">用 watchpoint 抓变量</tspan>：`watch sensor_value` → 值变化时自动暂停，比断点更精准</tspan>
  </text>
  <text x="30" y="410" font-size="10" fill="#666" font-style="italic">GDB 是"看到证据"的工具，不是"证明没问题"的工具——带着假设去调试，别盲目单步</text>
  
  <!-- Continuous animation: pulse on breakpoint -->
  <circle cx="585" cy="105" r="12" fill="#dc2626" opacity="0.2">
    <animate attributeName="r" values="12;18;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
