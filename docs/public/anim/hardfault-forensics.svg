<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>HardFault 现场：故障升级、栈帧取证、PC 对行号</title>
  <desc>四阶段动画，把"程序死了怎么破案"画成一条流水线：① 案发——crash_null 里那条 str r2,[r3,#0] 往地址 0 写，命中访存不存在的内存；② 故障升级——可配置故障（MemManage/BusFault/UsageFault）没使能就上调成 HardFault，HFSR.FORCED=1，真凶要去 CFSR 找；③ 现场取证——异常进入时硬件自动压 8 个字（r0-r3/r12/LR/PC/xPSR），案发 PC 就躺在偏移 24；④ PC 对行号——把 0x080008e 喂给 addr2line，得到 fault_ctx.c:70，正是那行空指针写。图上有一个始终在烧的红点：案发地址 0x080008e 持续命中等你去读它。</desc>
  <rect width="720" height="452" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">HardFault 现场：故障升级 → 栈帧取证 → PC 对行号</text>
  <text x="24" y="50" font-size="12" fill="#666">先看 HFSR.FORCED 判定"升级案"，再回 CFSR 找真凶；栈帧偏移 24 是案发 PC，addr2line 反查源码行</text>

  <!-- 持续在烧的案发地址（整段动画都在"命中"） -->
  <g>
    <rect x="470" y="18" width="230" height="26" rx="4" fill="#fdf0d5" stroke="#dc2626"/>
    <text x="585" y="35" font-size="12" font-family="Consolas,monospace" font-weight="bold" fill="#dc2626" text-anchor="middle">0x080008e 一直在烧
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ===== 阶段一：案发 ===== -->
  <g opacity="1">
    <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="66" width="640" height="170" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="56" y="90" font-size="13" font-weight="bold" fill="#dc2626">案发：crash_null 往地址 0 写</text>
    <text x="56" y="114" font-size="13" font-family="Consolas,monospace" fill="#333">08000084 &lt;crash_null&gt;:</text>
    <text x="56" y="138" font-size="13" font-family="Consolas,monospace" fill="#333">  8000088:  4b03  ldr r3, [pc, #12]   ; r3 = &amp;g_null_ptr</text>
    <text x="56" y="162" font-size="13" font-family="Consolas,monospace" fill="#333">  800008c:  4a03  ldr r2, [pc, #12]   ; r2 = 0xDEADBEEF</text>
    <rect x="56" y="176" width="400" height="24" fill="#fdf0d5" rx="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="62" y="192" font-size="13" font-family="Consolas,monospace" font-weight="bold" fill="#dc2626">800008e:  601a  str r2, [r3, #0]   ; 往地址 0 写 → 崩溃</text>
    <text x="56" y="220" font-size="12" fill="#666">g_null_ptr 值是 0，str 就把数据写进"不存在的内存"——精确总线错误（PRECISERR）。</text>
  </g>

  <!-- ===== 阶段二：升级 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="66" width="640" height="170" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="56" y="90" font-size="13" font-weight="bold" fill="#d97706">故障升级：可配置故障没使能 → 上调成 HardFault</text>
    <text x="56" y="118" font-size="13" fill="#333">BusFault / MemManage / UsageFault 各自有 SHCSR 里的使能位（16/17/18）。</text>
    <text x="56" y="142" font-size="13" fill="#333">没使能时 <tspan fill="#d97706" font-weight="bold">不单独上报，直接升级成 HardFault</tspan>——此时 HFSR.FORCED=1。</text>
    <text x="56" y="172" font-size="13" font-family="Consolas,monospace" fill="#333">HFSR = 0x40000000 → FORCED —— 被升级：真凶在 CFSR，去查它</text>
    <text x="56" y="206" font-size="12" fill="#666">所以看到 HardFault 别急着翻 HardFault，先看 FORCED，再回 CFSR 找真凶。</text>
  </g>

  <!-- ===== 阶段三：现场取证 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="66" width="640" height="170" rx="8" fill="#ffffff" stroke="#3451b2" stroke-width="2"/>
    <text x="56" y="90" font-size="13" font-weight="bold" fill="#3451b2">现场取证：异常进入，硬件自动压 8 个字</text>
    <g font-size="12" font-family="Consolas,monospace">
      <rect x="56" y="104" width="72" height="26" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="92" y="121" fill="#64748b" text-anchor="middle">r0</text>
      <rect x="132" y="104" width="72" height="26" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="168" y="121" fill="#64748b" text-anchor="middle">r1</text>
      <rect x="208" y="104" width="72" height="26" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="244" y="121" fill="#64748b" text-anchor="middle">r2</text>
      <rect x="284" y="104" width="72" height="26" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="320" y="121" fill="#64748b" text-anchor="middle">r3</text>
      <rect x="360" y="104" width="72" height="26" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="396" y="121" fill="#64748b" text-anchor="middle">r12</text>
      <rect x="436" y="104" width="72" height="26" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="472" y="121" fill="#64748b" text-anchor="middle">LR</text>
      <rect x="512" y="104" width="72" height="30" fill="#fdf0d5" stroke="#dc2626" stroke-width="2" rx="3"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite"/></rect><text x="548" y="123" fill="#dc2626" text-anchor="middle">PC</text>
      <rect x="588" y="104" width="72" height="26" fill="#f1f5f9" stroke="#94a3b8" rx="3"/><text x="624" y="121" fill="#64748b" text-anchor="middle">xPSR</text>
    </g>
    <text x="584" y="156" font-size="12" font-weight="bold" fill="#dc2626">偏移 24 = 案发 PC</text>
    <text x="56" y="184" font-size="13" fill="#333">案发 PC 就在偏移 24（frame[6]）；LR 在偏移 20（还原调用链）。</text>
    <text x="56" y="212" font-size="12" fill="#666">拿错栈（MSP/PSP）读出来全是垃圾——判据是 EXC_RETURN 的 bit2。</text>
  </g>

  <!-- ===== 阶段四：PC 对行号 ===== -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
    <rect x="40" y="66" width="640" height="170" rx="8" fill="#ffffff" stroke="#3eaf7c" stroke-width="2"/>
    <text x="56" y="90" font-size="13" font-weight="bold" fill="#1a7f56">PC 对行号：addr2line 反查源码</text>
    <text x="56" y="120" font-size="13" font-family="Consolas,monospace" fill="#333">arm-none-eabi-addr2line -e fault_ctx.elf 0x080008e</text>
    <text x="56" y="150" font-size="14" font-weight="bold" fill="#3eaf7c" font-family="Consolas,monospace">→ fault_ctx.c:70</text>
    <text x="56" y="184" font-size="13" fill="#333">那行正是 <tspan font-family="Consolas,monospace" font-weight="bold">*g_null_ptr = 0xDEADBEEF;</tspan>——空指针写的真凶行。</text>
    <text x="56" y="210" font-size="12" fill="#d97706">注意：nm 的函数入口是 0x08000084（函数第一行），真凶是 0x080008e（出错那条指令）——差 10 字节、差 1 行。</text>
  </g>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">① 案发：str r2,[r3,#0] 往地址 0 写，触及不存在的内存</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">② 升级——故障没使能就上调 HardFault，HFSR.FORCED=1，真凶在 CFSR</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">③ 取证——硬件自动压 8 个字，案发 PC 在偏移 24（frame[6]）</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="404">④ 对行号——PC=0x080008e 喂给 addr2line → fault_ctx.c:70</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,426)" fill="#3451b2">
    <circle cx="0" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>