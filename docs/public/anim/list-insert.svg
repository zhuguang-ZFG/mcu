<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="720" height="420" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">FreeRTOS 的"链"：一条按值排序的双向链表</text>
  <text x="24" y="50" font-size="12" fill="#666">就绪/延时/阻塞，全是同一种 List_t；插入按 xItemValue 找位置，tick 一到就搬家——指针跳几次，任务就醒了</text>

  <!-- 就绪链表 -->
  <text x="40" y="92" font-size="13" font-weight="bold" fill="#3eaf7c">就绪链表（pxReadyTasksLists）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="104" width="110" height="52" fill="#dbe7ff" stroke="#3451b2" rx="6"/>
    <text x="95" y="126" fill="#3451b2" font-weight="bold">TCB_A</text>
    <text x="95" y="144" fill="#666" font-family="Consolas,monospace">值=2</text>
    <rect x="230" y="104" width="110" height="52" fill="#dbe7ff" stroke="#3451b2" rx="6"/>
    <text x="285" y="126" fill="#3451b2" font-weight="bold">TCB_B</text>
    <text x="285" y="144" fill="#666" font-family="Consolas,monospace">值=8</text>
    <rect x="420" y="104" width="110" height="52" fill="#f1f5f9" stroke="#94a3b8" rx="6" stroke-dasharray="4 3"/>
    <text x="475" y="126" fill="#888" font-weight="bold">xListEnd</text>
    <text x="475" y="144" fill="#888">哨兵（首尾一体）</text>
  </g>
  <!-- 新节点 TCB_C 值=5 -->
  <g transform="translate(190,30)">
    <animateTransform attributeName="transform" type="translate" calcMode="discrete"
      values="190 30;190 30;190 104;190 104;190 104;190 104;190 104;190 30" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
    <rect width="110" height="52" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="6"/>
    <text x="55" y="22" font-size="11" fill="#92400e" font-weight="bold" text-anchor="middle">TCB_C（新）</text>
    <text x="55" y="40" font-size="11" fill="#92400e" text-anchor="middle" font-family="Consolas,monospace">值=5</text>
  </g>
  <!-- 链接箭头（静态 + 重连高亮） -->
  <path d="M150,130 L230,130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M340,130 L420,130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M530,130 L600,130 L600,70 L40,70 L40,104" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  <g opacity="0" stroke="#d97706" stroke-width="2.5" fill="none">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;1;1;1;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
    <path d="M150,130 L190,130" marker-end="url(#arrO2)"/>
    <path d="M300,130 L340,130" marker-end="url(#arrO2)"/>
  </g>
  <defs>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arrO2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0,0 7,3 0,6" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 延时链表 -->
  <text x="40" y="216" font-size="13" font-weight="bold" fill="#d97706">延时链表（xDelayedTaskList，按唤醒时刻排序）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="228" width="110" height="52" fill="#fef3c7" stroke="#d97706" rx="6"/>
    <text x="95" y="250" fill="#92400e" font-weight="bold">TCB_D 睡觉中</text>
    <text x="95" y="268" fill="#92400e" font-family="Consolas,monospace">唤醒值=100</text>
    <rect x="230" y="228" width="110" height="52" fill="#f1f5f9" stroke="#94a3b8" rx="6" stroke-dasharray="4 3"/>
    <text x="285" y="250" fill="#888" font-weight="bold">xListEnd</text>
    <text x="285" y="268" fill="#888">哨兵</text>
  </g>
  <path d="M150,254 L230,254" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- tick 计数牌 -->
  <rect x="420" y="228" width="150" height="52" fill="#ffffff" stroke="#3451b2" rx="6"/>
  <text x="495" y="248" font-size="11" fill="#3451b2" text-anchor="middle">系统 tick</text>
  <g font-size="16" font-weight="bold" fill="#3451b2" text-anchor="middle" font-family="Consolas,monospace">
    <text x="495" y="270" opacity="1">98<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0;1" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="495" y="270" opacity="0">99<animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="495" y="270" opacity="0">100<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;1;1;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/></text>
  </g>

  <!-- TCB_D 搬家箭头 -->
  <path d="M95,228 L95,180 L150,170" stroke="#3eaf7c" stroke-width="2.5" fill="none" stroke-dasharray="6 4" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;1;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
  </path>
  <text x="95" y="200" font-size="10" fill="#3eaf7c" font-weight="bold" opacity="0">搬家→就绪
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;1;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
  </text>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="330">① 就绪链表按"值"排好队：2 → 8 → 哨兵（哨兵首尾一体，省判空）</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="330">② 新任务 TCB_C 值=5：从哨兵出发找位置——比 2 大、比 8 小</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="330">③ 落位 A、B 之间：只改 4 根指针，插入完成（O(n) 找，O(1) 插）</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="330">④ 与此同时，TCB_D 在延时链表里睡觉：唤醒值 100 排在最前</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="330">⑤ tick 99→100：D 的唤醒时刻到了！</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;1;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="330">⑥ 每个 tick 只查队首一个节点：到点就搬家到就绪链表——这就是 vTaskDelay 的真相</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;0;0;1" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="330">整条 RTOS 只有这一种数据结构在跳舞——阻塞链表、挂起链表都是它 →</text></g>
  </g>
  <g font-size="11" fill="#666">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="350">优先级相同的任务共用一条链表，xItemValue 兼作轮转计数</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="350">vListInsert 从后往前比，同值插到同值最后——公平轮转的小心机</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="350">pxNext/pxPrevious 双向都有，删除也是 O(1)</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="350">延时链表按"唤醒 tick 值"排序，队首永远是最早要醒的</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="350">xTaskIncrementTick 只查队首——这就是 tick 开销 O(1) 的秘密</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;1;0" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="350">醒了若优先级更高 → 置 PendSV，下一章切换现场见</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;0;0;1" keyTimes="0;0.14;0.28;0.42;0.56;0.70;0.84;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="350">动手：GDB 里 p pxReadyTasksLists[1] 展开 uxNumberOfItems 数数</text></g>
  </g>
</svg>
