<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>TIM 输入捕获：边沿拍照测频率</title>
  <desc>四阶段动画：PA6 输出 1kHz 方波，跳线接到 PA7；每个上升沿硬件把 CNT 锁进 CCR2；两次拍照的差值 1000 拍 × 1µs = 1kHz；CNT 回绕时用无符号减法自动处理模差。</desc>
  <rect width="720" height="420" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">输入捕获：引脚边沿一到，硬件把 CNT 拍进 CCR</text>
  <text x="24" y="50" font-size="12" fill="#666">PA6(PWM) → 跳线 → PA7(捕获) · CNT 1MHz 计数 · 差值 1000 拍 = 1kHz · 回绕靠无符号减法</text>

  <!-- 方波轨道 -->
  <rect x="40" y="80" width="640" height="110" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="56" y="102" font-size="13" font-weight="bold" fill="#3451b2">PA6 上的 1kHz 方波（TIM3_CH1 输出）</text>
  <polyline points="70,170 130,170 130,120 190,120 190,170 250,170 250,120 310,120 310,170 370,170 370,120 430,120 430,170 490,170 490,120 550,120 550,170 610,170 610,120 670,120"
            stroke="#3451b2" stroke-width="3" fill="none"/>
  <text x="640" y="108" font-size="11" fill="#666" text-anchor="end">↑ 上升沿 = 拍照时刻</text>

  <!-- CNT 轨道 -->
  <rect x="40" y="210" width="640" height="80" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="56" y="232" font-size="13" font-weight="bold" fill="#3451b2">CNT 在涨（1MHz：1 拍 = 1µs）</text>
  <line x1="70" y1="270" x2="670" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <text x="70" y="256" font-size="12" font-family="Consolas,monospace" fill="#666">CNT=0</text>
  <text x="610" y="256" font-size="12" font-family="Consolas,monospace" fill="#666">CNT=999 (ARR)</text>

  <!-- 两次拍照的标记（阶段①②点亮） -->
  <g font-family="Consolas,monospace" font-size="12">
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;1;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <line x1="130" y1="120" x2="130" y2="270" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cx="130" cy="270" r="6" fill="#d97706"/>
      <text x="140" y="284" fill="#d97706" font-weight="bold">拍照① CCR2=200</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <line x1="490" y1="120" x2="490" y2="270" stroke="#3eaf7c" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cx="490" cy="270" r="6" fill="#3eaf7c"/>
      <text x="500" y="284" fill="#3eaf7c" font-weight="bold">拍照② CCR2=1200</text>
    </g>
  </g>

  <!-- CCR2 寄存器 -->
  <rect x="40" y="310" width="300" height="70" fill="#ffffff" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="56" y="332" font-size="13" font-weight="bold" fill="#d97706">CCR2（硬件锁存，不要 CPU 掐表）</text>
  <text x="56" y="354" font-size="12" font-family="Consolas,monospace" fill="#666">边沿一到：CCR2 ← CNT（同一拍）</text>

  <!-- 计算面板（阶段③点亮） -->
  <rect x="370" y="310" width="310" height="70" fill="#ffffff" stroke="#3eaf7c" stroke-width="2" rx="8"/>
  <text x="386" y="332" font-size="13" font-weight="bold" fill="#3eaf7c">CPU 只做一次减法</text>
  <text x="386" y="354" font-size="12" font-family="Consolas,monospace" fill="#666">Δ=1200-200=1000 拍 → 1000µs</text>
  <text x="386" y="372" font-size="12" font-family="Consolas,monospace" fill="#666">f = 1MHz/1000 = 1kHz ✓ 对账成功</text>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="408">① 方波在 PA6 上跑，跳线送到 PA7——信号源和测量端都是我们自己</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="408">② 第一个上升沿：硬件把 CNT=200 锁进 CCR2——CPU 这时候在干别的</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="408">③ 第二个上升沿：CCR2=1200。CPU 读走两次值，做一次减法</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
      <text x="36" y="408">④ 回绕怎么办：now-last 用无符号减法，CNT 归零绕圈自动算出模差</text></g>
  </g>

  <!-- 阶段指示点 -->
  <g transform="translate(630,400)" fill="#3451b2">
    <circle cx="0" cy="0" r="5" opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0.2;0.2;0.2;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;0.2;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;0.2;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="54" cy="0" r="5" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/></circle>
  </g>
</svg>