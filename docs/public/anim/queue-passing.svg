<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="720" height="420" fill="#f6f8fa"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#3451b2">队列：传值不传址的传送带</text>
  <text x="24" y="50" font-size="12" fill="#666">生产者把数据**拷贝**进槽位（不是给指针）；满了生产者睡，空了消费者睡——睡觉不耗 CPU，唤醒零轮询</text>

  <!-- 生产者 -->
  <rect x="40" y="90" width="140" height="110" fill="#ffffff" stroke="#3eaf7c" stroke-width="2" rx="8"/>
  <text x="110" y="116" font-size="13" font-weight="bold" fill="#3eaf7c" text-anchor="middle">生产者任务</text>
  <text x="110" y="136" font-size="11" fill="#666" text-anchor="middle">xQueueSend()</text>
  <text id="prodState" x="110" y="172" font-size="12" font-weight="bold" fill="#3eaf7c" text-anchor="middle">干活中</text>

  <!-- 队列槽位 ×5 -->
  <rect x="240" y="80" width="240" height="140" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="256" y="102" font-size="12" font-weight="bold" fill="#3451b2">队列（5 槽环形缓冲）</text>
  <g stroke="#94a3b8" fill="#f8fafc">
    <rect x="256" y="116" width="40" height="56" rx="4"/><rect x="300" y="116" width="40" height="56" rx="4"/>
    <rect x="344" y="116" width="40" height="56" rx="4"/><rect x="388" y="116" width="40" height="56" rx="4"/>
    <rect x="432" y="116" width="40" height="56" rx="4"/>
  </g>
  <!-- 槽内数据（阶段出现） -->
  <g font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle" font-family="Consolas,monospace">
    <text x="276" y="150" opacity="0">7<animate attributeName="opacity" calcMode="discrete" values="0;1;1;1;1;1;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="320" y="150" opacity="0">9<animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;1;1;1;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="364" y="150" opacity="0">4<animate attributeName="opacity" calcMode="discrete" values="0;0;1;1;1;1;1;1" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/></text>
  </g>
  <!-- head/tail 指针 -->
  <g transform="translate(276,182)">
    <animateTransform attributeName="transform" type="translate" calcMode="discrete"
      values="276 182;276 182;276 182;276 182;320 182;320 182;364 182;276 182" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
    <polygon points="-8,0 8,0 0,10" fill="#3451b2"/>
    <text y="24" font-size="10" fill="#3451b2" text-anchor="middle">head 取</text>
  </g>
  <g transform="translate(276,114)">
    <animateTransform attributeName="transform" type="translate" calcMode="discrete"
      values="276 114;320 114;364 114;408 114;408 114;408 114;408 114;276 114" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
    <polygon points="-8,0 8,0 0,-10" fill="#d97706"/>
    <text y="-14" font-size="10" fill="#d97706" text-anchor="middle">tail 放</text>
  </g>

  <!-- 流动的小方块：生产者→tail，head→消费者 -->
  <rect x="196" y="130" width="16" height="16" fill="#3eaf7c" rx="3" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;60 0;60 0" keyTimes="0;0.10;1" dur="15s" repeatCount="indefinite"/>
  </rect>
  <rect x="480" y="130" width="16" height="16" fill="#3451b2" rx="3" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;60 0;60 0" keyTimes="0;0.10;1" dur="15s" repeatCount="indefinite"/>
  </rect>

  <!-- 消费者 -->
  <rect x="540" y="90" width="140" height="110" fill="#ffffff" stroke="#3451b2" stroke-width="2" rx="8"/>
  <text x="610" y="116" font-size="13" font-weight="bold" fill="#3451b2" text-anchor="middle">消费者任务</text>
  <text x="610" y="136" font-size="11" fill="#666" text-anchor="middle">xQueueReceive()</text>
  <text x="610" y="172" font-size="12" font-weight="bold" fill="#3451b2" text-anchor="middle">干活中</text>

  <!-- 拷贝示意 -->
  <rect x="240" y="240" width="440" height="60" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
  <text x="256" y="264" font-size="12" font-weight="bold" fill="#3451b2">为什么是"拷贝"不是"指针"？</text>
  <text x="256" y="284" font-size="11" fill="#666">生产者的局部变量下一秒就没了；拷贝进队列，数据自己的生命自己管——悬垂指针免疫。</text>

  <!-- 阶段字幕 -->
  <g font-size="13" font-weight="bold" fill="#3451b2">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="340">① 空队列：head=tail，消费者读不到东西</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="340">② 生产者放一个：数据**拷贝**进 tail 槽，tail 前进一格</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="340">③ 再放两个：tail 一路追，队列渐满</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="340">④ 消费者取一个：head 槽数据拷出，head 前进——FIFO 铁律</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="340">⑤ 再取一个：先放的先走（7 比 9 先出门）</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="340">⑥ 若取空：消费者**阻塞睡觉**，不耗一个 CPU 周期</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;0;1;1" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="340">数据一到，消费者被内核直接唤醒——没有 while 轮询的世界 →</text></g>
  </g>
  <g font-size="11" fill="#666">
    <g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="360">消费者此刻在阻塞态：睡觉，等货上门</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="360">拷进队列的那一刻，生产者手里的原件就可以销毁了</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="360">若再放满：生产者也会阻塞——背压（backpressure）的天然来源</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="360">取走 = 拷贝 + head 前移，槽位立即可被复用</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="360">环形：tail/head 到尾就绕回第 0 槽</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1;0;0" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="360">xQueueReceive 带超时：睡多久你说了算，portMAX_DELAY = 睡到地老天荒</text></g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;0;1;1" keyTimes="0;0.15;0.30;0.45;0.60;0.75;0.90;1" dur="15s" repeatCount="indefinite"/>
      <text x="36" y="360">ISR 里要用 xQueueSendFromISR——普通版在中断里是禁品</text></g>
  </g>
</svg>
